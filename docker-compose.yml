services:
  mysql:
    image: mysql:8.0
    container_name: parking-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD es requerido}
      MYSQL_DATABASE: ${DB_NAME:-parking_db}
      MYSQL_USER: ${DB_USER:-parking_user}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS es requerido}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - parking-net

  api:
    build: .
    container_name: parking-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_USER: ${DB_USER:-parking_user}
      DB_PASS: ${DB_PASS:?DB_PASS es requerido}
      DB_NAME: ${DB_NAME:-parking_db}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      PORT: ${PORT:-8080}
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerido}
      JWT_ISSUER: ${JWT_ISSUER:-parking-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-parking-api}
      JWT_ACCESS: ${JWT_ACCESS:-15m}
      JWT_REFRESH: ${JWT_REFRESH:-72h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-America/Bogota}
      DEFAULT_VEHICLE_TYPE_CODE: ${DEFAULT_VEHICLE_TYPE_CODE:-car}
      READ_TIMEOUT: ${READ_TIMEOUT:-10s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-10s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-60s}
    healthcheck:
      test: [ "CMD", "/bin/healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - parking-net

  caddy:
    image: caddy:2.8-alpine
    container_name: parking-caddy
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - parking-net

  adminer:
    image: adminer:4
    container_name: parking-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha
    networks:
      - parking-net

networks:
  parking-net:
    driver: bridge

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
