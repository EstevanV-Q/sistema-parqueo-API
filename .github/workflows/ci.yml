name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: Lint y seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --timeout=5m

      - name: govulncheck (vulnerabilidades conocidas, bloqueante)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: gosec (análisis estático de seguridad)
        uses: securego/gosec@v2.30.0
        with:
          args: "-fmt=sarif -out=gosec.sarif ./..."
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
        continue-on-error: true

  test:
    name: Test y cobertura
    needs: lint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_DATABASE: parking_db
          MYSQL_USER: parking_user
          MYSQL_PASSWORD: ci-app-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root-${{ github.run_id }}-${{ github.run_attempt }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Ejecutar go vet
        run: go vet ./...

      - name: Ejecutar tests con cobertura
        env:
          DB_USER: parking_user
          DB_PASS: ci-app-${{ github.run_id }}-${{ github.run_attempt }}
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: parking_db
          JWT_SECRET: ci-jwt-${{ github.run_id }}-${{ github.run_attempt }}-at-least-32-chars
          JWT_ACCESS: 15m
          JWT_REFRESH: 72h
          PORT: 8080
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Publicar cobertura
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build y Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binario
        run: go build -o bin/api ./cmd/api

      - name: Verificar que compila todo (incluido migrate/seed/offline)
        run: go build ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: parking-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
