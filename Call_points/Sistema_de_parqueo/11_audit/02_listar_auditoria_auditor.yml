info:
  name: "Listar auditoría con rol auditor"
  type: http
  seq: 2

http:
  method: GET
  url: "http://localhost:8080/api/v1/audit?action=ticket.settle&limit=20"
  auth:
    type: bearer
    token: "{{auditorToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("auditor puede consultar", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Requiere haber ejecutado 01_auth/03_login_auditor.yml.
