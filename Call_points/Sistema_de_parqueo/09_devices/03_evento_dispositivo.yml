info:
  name: "Evento de dispositivo (X-Device-Key)"
  type: http
  seq: 3

http:
  method: POST
  url: "http://localhost:8080/api/v1/devices/events"
  headers:
    - name: "Content-Type"
      value: "application/json"
    - name: "X-Device-Key"
      value: "{{deviceApiKey}}"
  body:
    type: json
    data: |-
      {
        "event_id": "evt-{{$guid}}",
        "event_type": "heartbeat"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("evento procesado", function () {
          expect([200]).to.include(res.status);
        });
        test("comando allow", function () {
          expect(res.body.command).to.equal("allow");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  No usa JWT: se autentica con el header X-Device-Key. El heartbeat no crea tickets.
