info:
  name: "Listar dispositivos"
  type: http
  seq: 2

http:
  method: GET
  url: "http://localhost:8080/api/v1/devices?site_id={{siteId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        var list = Array.isArray(res.body) ? res.body : [];
        if (list.length > 0) {
          bru.setVar("firstDeviceId", list[0].ID);
        }
    - type: tests
      code: |-
        test("lista de dispositivos", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
