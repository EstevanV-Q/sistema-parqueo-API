info:
  name: "Login operador"
  type: http
  seq: 2

http:
  method: POST
  url: "http://localhost:8080/api/v1/auth/login"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "username": "{{operatorUser}}",
        "password": "{{operatorPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.access_token) {
          bru.setVar("operatorToken", res.body.access_token);
        }
    - type: tests
      code: |-
        test("login operador correcto", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
