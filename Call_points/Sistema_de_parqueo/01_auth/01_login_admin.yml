info:
  name: Login admin
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/v1/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{adminUser}}",
        "password": "{{adminPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.access_token) {
          bru.setVar("accessToken", res.body.access_token);
          bru.setVar("refreshToken", res.body.refresh_token);
        }
    - type: tests
      code: |-
        test("login admin correcto", function () {
          expect([200]).to.include(res.status);
        });
        test("devuelve access_token", function () {
          expect(res.body.access_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Guarda accessToken y refreshToken para el resto de la colección.
