      code: |-
        test("sesión cerrada", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Ejecutar al final: revoca el refresh token y obliga a volver a hacer login.
