info:
  name: "Logout (revocar refresh token)"
  type: http
  seq: 7

http:
  method: POST
  url: "http://localhost:8080/api/v1/auth/logout"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refreshToken}}"
      }

runtime:
