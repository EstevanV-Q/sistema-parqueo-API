info:
  name: "Crear cliente"
  type: http
  seq: 2

http:
  method: POST
  url: "http://localhost:8080/api/v1/customers"
  auth:
    type: bearer
    token: "{{accessToken}}"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "document": "BRUNO{{$timestamp}}",
        "name": "Cliente Bruno {{$timestamp}}",
        "phone": "3000000000",
        "email": "bruno{{$timestamp}}@example.com"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body) {
          bru.setVar("testCustomerId", res.body.ID);
        }
    - type: tests
      code: |-
        test("cliente creado", function () {
          expect([201]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
