info:
  name: "Listar pagos"
  type: http
  seq: 4

http:
  method: GET
  url: "http://localhost:8080/api/v1/payments?site_id={{siteId}}&from=2020-01-01&to=2030-12-31&limit=20"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        var list = (res.body && res.body.data) ? res.body.data : [];
        if (list.length > 0) {
          bru.setVar("firstPaymentId", list[0].ID);
        }
    - type: tests
      code: |-
        test("lista de pagos", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
