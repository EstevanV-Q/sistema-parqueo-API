http:
  method: POST
  url: "http://localhost:8080/api/v1/payments/{{paymentId}}/refund"
  auth:
    type: bearer
    token: "{{accessToken}}"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "reason": "Prueba Bruno"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("pago reembolsado", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
