info:
  name: "Listar tarifas"
  type: http
  seq: 1

http:
  method: GET
  url: "http://localhost:8080/api/v1/rate-plans?site_id={{siteId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        var list = Array.isArray(res.body) ? res.body : [];
        var plan = list.find(function (p) { return p.IsActive === true; }) || list[0];
        if (plan) {
          bru.setVar("ratePlanId", plan.ID);
          bru.setVar("ratePlanName", plan.Name);
        }
        var testPlan = list.find(function (p) { return String(p.Name).indexOf("Tarifa Bruno") === 0; });
        if (testPlan) {
          bru.setVar("testRatePlanId", testPlan.ID);
        }
    - type: tests
      code: |-
        test("lista de tarifas", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
