info:
  name: "Ocupación en tiempo real (WebSocket)"
  type: websocket
  seq: 2

websocket:
  url: "{{wsUrl}}/api/v1/ws/occupancy?site_id={{siteId}}&ticket={{wsTicket}}"

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  Conectar y esperar los mensajes del servidor.

  Requiere ejecutar 12_realtime/00_ws_ticket.yml para obtener wsTicket y
  02_catalog/sites/01_listar_sedes.yml para tener siteId.
