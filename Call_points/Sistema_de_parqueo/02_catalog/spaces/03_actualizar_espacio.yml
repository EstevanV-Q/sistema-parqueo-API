info:
  name: "Actualizar espacio (admin)"
  type: http
  seq: 3

http:
  method: PUT
  url: "http://localhost:8080/api/v1/catalog/spaces/{{testSpaceId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "code": "{{testSpaceCode}}",
        "type": "car",
        "status": "free",
        "is_active": true
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("espacio actualizado", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
