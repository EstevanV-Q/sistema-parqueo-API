info:
  name: "Crear espacio (admin)"
  type: http
  seq: 2

http:
  method: POST
  url: "http://localhost:8080/api/v1/catalog/spaces"
  auth:
    type: bearer
    token: "{{accessToken}}"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "zone_id": "{{zoneId}}",
        "code": "BRUNO-{{$timestamp}}",
        "type": "car"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body) {
          bru.setVar("testSpaceId", res.body.ID);
          bru.setVar("testSpaceCode", res.body.Code);
        }
    - type: tests
      code: |-
        test("espacio creado", function () {
          expect([201]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
