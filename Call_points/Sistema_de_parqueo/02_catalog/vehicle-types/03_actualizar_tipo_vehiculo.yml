info:
  name: "Actualizar tipo de vehículo (admin)"
  type: http
  seq: 3

http:
  method: PUT
  url: "http://localhost:8080/api/v1/catalog/vehicle-types/{{testVehicleTypeId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "name": "Tipo {{testVehicleTypeCode}} actualizado",
        "code": "{{testVehicleTypeCode}}",
        "is_active": true
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("tipo actualizado", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
