info:
  name: Crear zona (admin)
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/v1/catalog/zones
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "site_id": "{{siteId}}",
        "name": "Zona Bruno {{$timestamp}}",
        "type": "car",
        "capacity": 100
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
