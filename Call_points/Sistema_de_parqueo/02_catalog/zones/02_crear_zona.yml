  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body) {
          bru.setVar("testZoneId", res.body.ID);
          bru.setVar("testZoneName", res.body.Name);
        }
    - type: tests
      code: |-
        test("zona creada", function () {
          expect([201]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
