info:
  name: "Actualizar zona (admin)"
  type: http
  seq: 3

http:
  method: PUT
  url: "http://localhost:8080/api/v1/catalog/zones/{{testZoneId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "name": "{{testZoneName}} actualizada",
        "type": "car",
        "capacity": 8,
        "is_active": true
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("zona actualizada", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
