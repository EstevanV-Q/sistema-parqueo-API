info:
  name: "Liquidar ticket (pagar y cerrar)"
  type: http
  seq: 6

http:
  method: POST
  url: "http://localhost:8080/api/v1/tickets/{{ticketId}}/settle"
  auth:
    type: bearer
    token: "{{accessToken}}"
  headers:
    - name: "Content-Type"
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "paid_cents": 20000,
        "method": "cash"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("ticket liquidado", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
