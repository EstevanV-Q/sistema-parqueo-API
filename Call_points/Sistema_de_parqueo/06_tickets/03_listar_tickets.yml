info:
  name: "Listar tickets abiertos"
  type: http
  seq: 3

http:
  method: GET
  url: "http://localhost:8080/api/v1/tickets?site_id={{siteId}}&status=open&limit=20"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        var list = (res.body && res.body.data) ? res.body.data : [];
        if (list.length > 0) {
          bru.setVar("openTicketId", list[0].ID);
        }
    - type: tests
      code: |-
        test("lista de tickets", function () {
          expect([200]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
